name: Build Unity 3D Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"
    paths:
      - "unity/FC2026Unity/**"
      - ".github/workflows/unity-android.yml"
  pull_request:
    branches:
      - main
    paths:
      - "unity/FC2026Unity/**"
      - ".github/workflows/unity-android.yml"

permissions:
  contents: read

concurrency:
  group: unity-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unity-android:
    name: Build and verify Unity 6.3 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Unity license is configured
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::error::Add the UNITY_LICENSE repository secret before running the Unity Android build. See UNITY_3D.md."
            exit 1
          fi

      - name: Build Android APK with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity/FC2026Unity
          unityVersion: 6000.3.24f1
          targetPlatform: Android
          buildMethod: FC2026.EditorTools.AndroidBuilder.BuildAndroid

      - name: Verify APK package and write checksum
        env:
          APK_PATH: unity/FC2026Unity/Builds/Android/FC2026-3D-debug.apk
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import sys
          import zipfile

          apk = os.environ["APK_PATH"]
          if not os.path.isfile(apk):
              sys.exit(f"::error::Unity build did not produce the expected APK: {apk}")

          size = os.path.getsize(apk)
          if size < 1_000_000:
              sys.exit(f"::error::APK is unexpectedly small ({size} bytes); refusing to upload a likely incomplete build.")

          try:
              with zipfile.ZipFile(apk) as package:
                  corrupt_entry = package.testzip()
                  if corrupt_entry:
                      sys.exit(f"::error::APK archive contains a corrupt entry: {corrupt_entry}")
                  entries = set(package.namelist())
                  required = {"AndroidManifest.xml", "assets/bin/Data/boot.config", "lib/arm64-v8a/libil2cpp.so"}
                  missing = sorted(required - entries)
                  if missing:
                      sys.exit("::error::APK is missing expected Unity/Android entries: " + ", ".join(missing))
          except zipfile.BadZipFile:
              sys.exit("::error::Unity output is not a valid APK/ZIP archive.")

          digest = hashlib.sha256()
          with open(apk, "rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  digest.update(chunk)

          checksum_path = apk + ".sha256"
          with open(checksum_path, "w", encoding="utf-8") as checksum:
              checksum.write(f"{digest.hexdigest()}  {os.path.basename(apk)}\n")

          print(f"Verified APK: {apk}")
          print(f"Size: {size} bytes")
          print(f"SHA-256: {digest.hexdigest()}")
          print(f"Source commit: {os.environ['COMMIT_SHA']}")
          PY

      - name: Upload verified Unity APK
        uses: actions/upload-artifact@v4
        with:
          name: FC2026-Unity-3D-Android-APK-${{ github.sha }}
          path: |
            unity/FC2026Unity/Builds/Android/FC2026-3D-debug.apk
            unity/FC2026Unity/Builds/Android/FC2026-3D-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
