name: Legacy Capacitor WebView APK (manual only)

on:
  workflow_dispatch:

jobs:
  build-legacy-webview-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Build browser prototype
        run: npm run build

      - name: Generate legacy Capacitor Android project
        run: npx cap add android

      - name: Configure legacy Android shell
        run: node scripts/configure-android.mjs

      - name: Sync browser assets into WebView
        run: npx cap sync android

      - name: Build legacy debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload legacy WebView APK
        uses: actions/upload-artifact@v4
        with:
          name: FC2026-Legacy-WebView-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
