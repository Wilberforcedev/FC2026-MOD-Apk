<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield / Rounded Shape -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" stroke="#22c55e" stroke-width="6" />

  <!-- Geometric Pitch Lines Accent -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#22c55e" stroke-width="3" stroke-opacity="0.2" />
  <line x1="96" y1="256" x2="416" y2="256" stroke="#22c55e" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 6" />

  <!-- FC Triangle / Crest Emblem -->
  <path d="M 256 90 L 390 170 L 340 370 L 256 424 L 172 370 L 122 170 Z" 
        fill="#111c33" stroke="url(#neonGreen)" stroke-width="10" stroke-linejoin="round" />

  <!-- FC Monogram / Soccer Ball -->
  <g transform="translate(256, 240)">
    <!-- Soccer Ball Circle -->
    <circle cx="0" cy="0" r="82" fill="#ffffff" stroke="#0f172a" stroke-width="6" />
    <!-- Center Pentagon -->
    <polygon points="0,-32 30,-10 19,25 -19,25 -30,-10" fill="#0f172a" />
    <!-- Seams -->
    <line x1="0" y1="-32" x2="0" y2="-82" stroke="#0f172a" stroke-width="5" />
    <line x1="30" y1="-10" x2="78" y2="-26" stroke="#0f172a" stroke-width="5" />
    <line x1="19" y1="25" x2="48" y2="68" stroke="#0f172a" stroke-width="5" />
    <line x1="-19" y1="25" x2="-48" y2="68" stroke="#0f172a" stroke-width="5" />
    <line x1="-30" y1="-10" x2="-78" y2="-26" stroke="#0f172a" stroke-width="5" />
    <!-- Edge Patches -->
    <polygon points="-38,-72 0,-82 38,-72 20,-50 -20,-50" fill="#0f172a" opacity="0.9" />
  </g>

  <!-- 26 Badge -->
  <rect x="180" y="348" width="152" height="42" rx="10" fill="#0a0f1d" stroke="url(#goldGrad)" stroke-width="3" />
  <text x="256" y="377" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="900" font-size="26" fill="#facc15" letter-spacing="4">FC 2026</text>
</svg>
